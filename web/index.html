<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jaktrack · simulasi bus TransJakarta</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  body { font: 15px/1.4 system-ui, sans-serif; color: #111; }
  #bar { position: absolute; top: 12px; left: 12px; right: 12px; max-width: 360px; z-index: 1;
         background: #fff; border-radius: 12px; padding: 10px 14px; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  #bar h1 { font-size: 16px; margin: 0 0 2px; }
  #bar p { margin: 0; color: #444; }
  #tag { display: inline-block; background: #fde68a; color: #5b3d00; border-radius: 6px; padding: 0 6px; font-weight: 600; }
  #err { color: #b00020; }
  .maplibregl-popup-content { font: 14px/1.35 system-ui, sans-serif; }
</style>
</head>
<body>
<div id="bar">
  <h1>jaktrack</h1>
  <p><span id="tag">Simulasi</span> <span id="status">Memuat jadwal…</span></p>
  <p id="note">Posisi dihitung dari jadwal resmi, bukan posisi asli bus, jadi bisa meleset.</p>
  <p id="err" role="alert"></p>
</div>
<div id="map" role="application" aria-label="Peta simulasi bus TransJakarta"></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
