<div class="app tk-app" id="app" data-loading="" data-screen="home">
  <header class="topbar" id="topbar">
    <h1 class="tk-sr" data-i18n="brand">%APP_NAME%</h1>
    <button type="button" class="round back" id="b-back" data-act="back" aria-label="Back" data-i18n-aria="back"><svg class="i"><use href="#i-back"/></svg></button>
    <div class="segwrap">
      <div class="seg" role="tablist" aria-label="View" data-i18n-aria="tabs" data-seg>
        <button type="button" role="tab" data-tab="home" aria-selected="true" data-i18n="tab.map">Map</button>
        <button type="button" role="tab" data-tab="lines" aria-selected="false" data-i18n="tab.lines">Lines</button>
        <button type="button" role="tab" data-tab="stations" aria-selected="false" data-i18n="tab.stations">Stations</button>
      </div>
    </div>
    <button type="button" class="round oyen" data-act="about" aria-label="About %APP_NAME%" data-i18n-aria="about.open"><img width="44" height="44" alt="" draggable="false"></button>
  </header>

  <div class="map" id="map"></div>

  <div class="tk-tl" id="tk-tl"><button type="button" class="tk-sched" id="sched" data-act="sched" aria-label="Scheduled positions: what this means" data-i18n-aria="sched.aria"><span class="tk-pill"><i aria-hidden="true"></i><span data-i18n="sched">Scheduled</span></span></button></div>

  <div class="ctrls" id="ctrls">
    <div class="ccard" id="c3dcard">
      <button type="button" class="c3d" id="b-3d" aria-pressed="false" aria-label="3D city" data-i18n-aria="3d.aria" hidden>3D</button>
      <button type="button" class="c3d tk-ug" id="b-ug" aria-pressed="false" aria-label="Show the underground" data-i18n-aria="city3d.underground.aria" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h18"/><path d="M5 13h14M7 17h10" opacity=".55"/></svg></button>
      <button type="button" class="c3d tk-bus" id="b-bus" data-act="buses" aria-pressed="false" aria-label="Show live Toei buses" data-i18n-aria="bus.chip.aria" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="14" rx="3"/><path d="M5 11h14M8.5 14.5h.01M15.5 14.5h.01M8 17.5V20M16 17.5V20"/></svg></button>
      <button type="button" class="c3d tk-bus" id="b-cctv" aria-pressed="false" aria-label="Show traffic cameras (CCTV)" data-i18n-aria="cctv.chip.aria" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5 15 5l1.5 5L4.5 13.5z"/><path d="M16 9l4 .5-.8 3-3.4.3M8 12.5V17h-4M4 14.5v5"/></svg></button>
      <button type="button" id="b-locate" aria-label="Stations near me" data-i18n-aria="locate"><svg class="i"><use href="#i-locate"/></svg></button>
    </div>
    <div class="ccard czoom">
      <button type="button" id="b-zin" aria-label="Zoom in" data-i18n-aria="zoom.in"><svg class="i"><use href="#i-plus"/></svg></button>
      <button type="button" id="b-zout" aria-label="Zoom out" data-i18n-aria="zoom.out"><svg class="i"><use href="#i-minus"/></svg></button>
    </div>
  </div>

  <main class="pane" id="pane" aria-label="%APP_NAME%">
    <div class="grab" id="grab" data-drag>
      <i class="grabber" aria-hidden="true"></i>
      <p class="credit"><span data-i18n="credit.osm">Map data © OpenStreetMap contributors</span></p>
    </div>
    <header class="phead">
      <div class="ptitle"><h1 data-i18n="brand">%APP_NAME%</h1><button type="button" class="tk-badgebtn" data-act="sched" aria-label="Scheduled positions: what this means" data-i18n-aria="sched.aria"><span class="badge muted tk-badge"><i aria-hidden="true"></i><span data-i18n="sched">Scheduled</span></span></button></div>
      <button type="button" class="round oyen" data-act="about" aria-label="About %APP_NAME%" data-i18n-aria="about.open"><img width="44" height="44" alt="" draggable="false"></button>
    </header>
    <div class="ptabs">
      <div class="seg" role="tablist" aria-label="View" data-i18n-aria="tabs" data-seg>
        <button type="button" role="tab" data-tab="home" aria-selected="true" data-i18n="tab.map">Map</button>
        <button type="button" role="tab" data-tab="lines" aria-selected="false" data-i18n="tab.lines">Lines</button>
        <button type="button" role="tab" data-tab="stations" aria-selected="false" data-i18n="tab.stations">Stations</button>
      </div>
    </div>
    <div class="pbody" id="pbody">
      <div class="tk-sbar">
      <form class="search" id="search" role="search" autocomplete="off" data-drag>
        <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="Search stations, lines or trains" data-i18n-ph="search.ph" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Search stations, lines or trains" data-i18n-aria="search.ph">
        <button type="button" class="qx" id="qx" aria-label="Clear search" data-i18n-aria="search.clear" hidden><svg class="i" aria-hidden="true"><use href="#i-xc"/></svg></button>
      </form>
      <button type="button" class="tk-rbtn" id="b-route" data-act="route" aria-label="Plan a trip" data-i18n-aria="rt.open" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M8.4 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.6"/></svg></button>
      </div>
      <div class="views" id="view"></div>
    </div>
    <footer class="pfoot"><button type="button" class="credit" data-act="about" data-i18n="credit.foot">Timetable positions, live where marked · Map data © OpenStreetMap contributors · Not affiliated with any railway operator</button></footer>
  </main>

  <div class="loading" id="loading" role="status">
    <div class="lcard">
      <img class="lart" width="150" height="150" alt="" draggable="false">
      <p class="lt" id="load-t" data-i18n="load.t">Waiting for the train</p>
      <p class="ls" id="load-s" data-i18n="load.s">Getting the map and the Greater Jakarta timetable ready</p>
      <div class="ltrack" id="load-track"><i id="load-bar"></i></div>
      <button type="button" class="btn primary" id="load-retry" data-i18n="retry" hidden>Try again</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <p class="tk-sr" id="tk-say" role="status" aria-live="polite"></p>
</div>
<noscript><p class="nojs">%APP_NAME% needs JavaScript to show the map and the timetable.</p></noscript>
